<body>
  <!-- elabore um programa que gere uma tabela de jogos em fase eliminatória
   de um campeonato.
   Serão três funções:
   1ª add um clube ao vetor
   2ª listar clubes ( se houver)
   3ª montar tabela de jogos da seguinte forma: o primeiro com o último,
   segundo com penúltimo e assim por diante.
   -->
     <h1>Jogos Eliminatórios</h1>
  <form>
    <p>Clube:
      <input type="text" id="inClube" required autofocus>
      <input type="submit" value="Adicionar" id="btAdicionar">
    </p>
    <input type="button" value="Listar Clubes" id="btListar">
    <input type="button" value="Montar Tabela de Jogos" id="btJogar">
  </form>
  <pre></pre>
  <script src="exercicio1.js"></script>
</body>
</html>
